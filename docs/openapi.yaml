openapi: 3.0.3
info:
  title: Puesto de Chance API
  version: 1.0.0
  description: >-
    Contrato reconstruido a partir de las rutas y servicios de la implementación.
    Los datos se almacenan en memoria; no hay Swagger UI configurado.
servers:
  - url: http://localhost:3000
tags:
  - name: Salud
  - name: Autenticación
  - name: Sorteos
  - name: Tiquetes
  - name: Caja
paths:
  /health:
    get:
      tags: [Salud]
      summary: Consultar estado básico del proceso
      security: []
      responses:
        '200':
          description: Proceso HTTP responde.
          content:
            application/json:
              schema:
                type: object
                required: [estado, hora]
                properties:
                  estado:
                    type: string
                    example: ok
                  hora:
                    type: string
                    format: date-time
  /api/v1/auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, password]
              properties:
                usuario:
                  type: string
                  example: vendedor1
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Token y perfil sin contraseña.
          content:
            application/json:
              schema:
                type: object
                required: [token, usuario]
                properties:
                  token:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/perfil:
    get:
      tags: [Autenticación]
      summary: Obtener perfil del usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil sin contraseña.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/sorteos:
    get:
      tags: [Sorteos]
      summary: Listar sorteos
      security:
        - bearerAuth: []
      parameters:
        - name: tipo
          in: query
          schema:
            type: string
            enum: [CHANCE, BALOTO]
        - name: estado
          in: query
          schema:
            type: string
            example: ABIERTO
      responses:
        '200':
          description: Sorteos que coinciden con los filtros.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sorteo'
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [Sorteos]
      summary: Crear sorteo (ADMIN)
      security:
        - bearerAuth: []
      description: El servicio permite tipos CHANCE/BALOTO y exige una fecha futura.
      x-required-role: ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, nombre, fecha]
              properties:
                tipo:
                  type: string
                  enum: [CHANCE, BALOTO]
                nombre:
                  type: string
                fecha:
                  type: string
                  format: date-time
                acumulado:
                  type: integer
                  minimum: 0
                  default: 0
      responses:
        '201':
          description: Sorteo creado en estado ABIERTO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sorteo'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/sorteos/{id}:
    parameters:
      - $ref: '#/components/parameters/SorteoId'
    get:
      tags: [Sorteos]
      summary: Obtener sorteo por id
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sorteo encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sorteo'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/sorteos/{id}/resultado:
    parameters:
      - $ref: '#/components/parameters/SorteoId'
    post:
      tags: [Sorteos]
      summary: Registrar resultado y liquidar tiquetes activos (ADMIN)
      security:
        - bearerAuth: []
      x-required-role: ADMIN
      description: >-
        `resultado` es una cadena de cuatro dígitos para CHANCE y un objeto
        `{numeros, superbalota}` válido para BALOTO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resultado]
              properties:
                resultado:
                  oneOf:
                    - type: string
                      pattern: '^\d{4}$'
                    - $ref: '#/components/schemas/JugadaBaloto'
      responses:
        '200':
          description: Resultado registrado y tiquetes activos liquidados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sorteo'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/tickets/chance:
    post:
      tags: [Tiquetes]
      summary: Vender tiquete de chance (VENDEDOR)
      security:
        - bearerAuth: []
      x-required-role: VENDEDOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sorteoId, apuestas]
              properties:
                sorteoId:
                  type: integer
                cliente:
                  type: string
                  nullable: true
                apuestas:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    $ref: '#/components/schemas/ApuestaChance'
      responses:
        '201':
          description: Tiquete de chance creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tiquete'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/tickets/baloto:
    post:
      tags: [Tiquetes]
      summary: Vender tiquete de Baloto (VENDEDOR)
      security:
        - bearerAuth: []
      x-required-role: VENDEDOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sorteoId, jugadas]
              properties:
                sorteoId:
                  type: integer
                cliente:
                  type: string
                  nullable: true
                jugadas:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    oneOf:
                      - $ref: '#/components/schemas/JugadaBaloto'
                      - type: object
                        required: [aleatoria]
                        properties:
                          aleatoria:
                            type: boolean
                            enum: [true]
      responses:
        '201':
          description: Tiquete Baloto creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tiquete'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/tickets:
    get:
      tags: [Tiquetes]
      summary: Listar tiquetes visibles para el usuario
      security:
        - bearerAuth: []
      parameters:
        - name: fecha
          in: query
          description: Prefijo de fecha ISO de creación.
          schema:
            type: string
            example: '2026-11-12'
        - name: estado
          in: query
          schema:
            type: string
            example: ACTIVO
      responses:
        '200':
          description: ADMIN ve todos; otros usuarios ven sus tiquetes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tiquete'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/tickets/{codigo}:
    parameters:
      - $ref: '#/components/parameters/CodigoTiquete'
    get:
      tags: [Tiquetes]
      summary: Consultar tiquete y resumen de sorteo
      description: La implementación requiere autenticación pero no comprueba propiedad para esta lectura.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tiquete, sorteo relacionado y condición de ganador si fue jugado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Tiquete'
                  - type: object
                    properties:
                      ganador:
                        type: boolean
                        nullable: true
                      sorteo:
                        $ref: '#/components/schemas/Sorteo'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/tickets/{codigo}/anular:
    parameters:
      - $ref: '#/components/parameters/CodigoTiquete'
    post:
      tags: [Tiquetes]
      summary: Anular tiquete
      description: El servicio autoriza ADMIN o al vendedor propietario, sujeto a reglas de estado y tiempo.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo:
                  type: string
      responses:
        '200':
          description: Tiquete anulado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tiquete'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/tickets/{codigo}/pagar:
    parameters:
      - $ref: '#/components/parameters/CodigoTiquete'
    post:
      tags: [Tiquetes]
      summary: Pagar premio (VENDEDOR)
      security:
        - bearerAuth: []
      x-required-role: VENDEDOR
      responses:
        '200':
          description: Pago registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pago'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /api/v1/caja/resumen:
    get:
      tags: [Caja]
      summary: Consultar resumen de caja
      security:
        - bearerAuth: []
      parameters:
        - name: fecha
          in: query
          schema:
            type: string
            example: '2026-11-12'
        - name: vendedorId
          in: query
          description: Aplicado por el controlador cuando el usuario es ADMIN.
          schema:
            type: integer
      responses:
        '200':
          description: Totales de ventas, pagos, saldo y cierre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenCaja'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/caja/cierre:
    post:
      tags: [Caja]
      summary: Cerrar caja (VENDEDOR)
      security:
        - bearerAuth: []
      x-required-role: VENDEDOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [efectivoReportado]
              properties:
                efectivoReportado:
                  type: integer
                  minimum: 0
                fecha:
                  type: string
                  description: Fecha local de caja; por defecto, fecha actual en zona configurada.
      responses:
        '201':
          description: Cierre registrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  diferencia:
                    type: integer
                  estado:
                    type: string
                    enum: [CUADRADA, SOBRANTE, FALTANTE]
                  efectivoReportado:
                    type: integer
                  saldoEsperado:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SorteoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    CodigoTiquete:
      name: codigo
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error de aplicación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    Usuario:
      type: object
      required: [id, usuario, nombre, rol]
      properties:
        id:
          type: integer
        usuario:
          type: string
        nombre:
          type: string
        rol:
          type: string
          enum: [ADMIN, VENDEDOR]
    Sorteo:
      type: object
      properties:
        id:
          type: integer
        tipo:
          type: string
          enum: [CHANCE, BALOTO]
        nombre:
          type: string
        fecha:
          type: string
          format: date-time
        estado:
          type: string
          enum: [ABIERTO, JUGADO]
        resultado:
          nullable: true
        acumulado:
          type: integer
    ApuestaChance:
      type: object
      required: [numero, valor]
      properties:
        numero:
          type: string
          pattern: '^\d{1,4}$'
        modalidad:
          type: string
          enum: [DIRECTO, COMBINADO]
          default: DIRECTO
        valor:
          type: integer
          minimum: 500
          maximum: 50000
          multipleOf: 100
    JugadaBaloto:
      type: object
      required: [numeros, superbalota]
      properties:
        numeros:
          type: array
          minItems: 5
          maxItems: 5
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 43
        superbalota:
          type: integer
          minimum: 1
          maximum: 16
    Tiquete:
      type: object
      properties:
        id:
          type: integer
        codigo:
          type: string
          example: CH-AB12CD34
        tipo:
          type: string
          enum: [CHANCE, BALOTO]
        sorteoId:
          type: integer
        vendedorId:
          type: integer
        cliente:
          type: string
          nullable: true
        total:
          type: integer
        estado:
          type: string
          enum: [ACTIVO, ANULADO, PAGADO, CADUCADO]
        premio:
          type: integer
          nullable: true
        creadoEn:
          type: string
          format: date-time
    Pago:
      type: object
      properties:
        id:
          type: integer
        ticketId:
          type: integer
        codigo:
          type: string
        usuarioId:
          type: integer
        valor:
          type: integer
        fecha:
          type: string
          format: date-time
    ResumenCaja:
      type: object
      properties:
        vendedorId:
          type: integer
        fecha:
          type: string
        tiquetesVendidos:
          type: integer
        tiquetesAnulados:
          type: integer
        ventasChance:
          type: integer
        ventasBaloto:
          type: integer
        totalVendido:
          type: integer
        premiosPagados:
          type: integer
        totalPagado:
          type: integer
        saldoEsperado:
          type: integer
        cerrada:
          type: boolean
